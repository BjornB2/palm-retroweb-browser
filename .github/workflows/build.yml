name: Build Palm OS applications

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both profiles
        run: make docker-build
      - uses: actions/upload-artifact@v4
        with:
          name: palm-prcs
          path: dist/*.prc
